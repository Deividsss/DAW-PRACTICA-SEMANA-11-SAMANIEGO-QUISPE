<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DEIVIDSAM STORE LA APP{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172b3a;
            --muted: #718096;
            --line: #e7edf1;
            --paper: #ffffff;
            --canvas: #f4f7f8;
            --teal: #087e78;
            --teal-dark: #075e5a;
            --mint: #e4f5f1;
            --amber: #fff2d8;
            --rose: #ffebeb;
            --shadow: 0 12px 36px rgba(27, 54, 68, .07);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.55;
        }
        a { color: inherit; }
        .topbar { background: #102b38; color: #fff; }
        .nav-wrap {
            max-width: 1180px;
            min-height: 76px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-mark {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            border-radius: 13px;
            background: #18a69b;
            color: #fff;
            font-size: 19px;
            font-weight: 800;
        }
        .brand-name { display: block; font-size: 15px; font-weight: 750; letter-spacing: .01em; }
        .brand-caption { display: block; color: #9fb6bf; font-size: 11px; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a {
            padding: 9px 14px;
            border-radius: 9px;
            color: #c8d7dc;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
        }
        .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,.1); color: #fff; }
        main { width: min(1180px, 100%); min-height: calc(100vh - 150px); margin: 0 auto; padding: 42px 28px 56px; }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
        .eyebrow { margin: 0 0 7px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 7px; font-size: clamp(27px, 4vw, 36px); letter-spacing: -.04em; line-height: 1.18; }
        h2 { margin-bottom: 4px; font-size: 18px; letter-spacing: -.02em; }
        .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            background: var(--teal);
            color: white;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s, transform .15s;
        }
        .button:hover { background: var(--teal-dark); transform: translateY(-1px); }
        .button-secondary { border: 1px solid var(--line); background: white; color: var(--ink); }
        .button-secondary:hover { background: #f8fbfb; color: var(--ink); }
        .card { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: var(--shadow); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { padding: 20px; }
        .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .stat-label { color: var(--muted); font-size: 12px; font-weight: 650; }
        .stat-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 11px; background: var(--mint); color: var(--teal); font-size: 17px; }
        .stat-value { display: block; margin-top: 13px; font-size: 27px; font-weight: 780; letter-spacing: -.04em; line-height: 1.1; }
        .stat-note { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; }
        .content-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 20px; }
        .section-card { overflow: hidden; }
        .section-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
        .section-header p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
        .text-link { color: var(--teal); font-size: 12px; font-weight: 750; text-decoration: none; white-space: nowrap; }
        .text-link:hover { text-decoration: underline; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 18px; background: #f8fafb; color: #74838e; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
        td { padding: 14px 18px; border-top: 1px solid #edf1f3; font-size: 13px; vertical-align: middle; }
        tbody tr:hover { background: #fbfdfd; }
        .product-name { display: block; font-weight: 700; }
        .product-description { display: block; max-width: 280px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        .price { font-weight: 750; white-space: nowrap; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 30px; font-size: 11px; font-weight: 750; white-space: nowrap; }
        .badge::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
        .ok { background: var(--mint); color: #13765b; }
        .agotado { background: var(--rose); color: #bb4444; }
        .low-stock { background: var(--amber); color: #9c690c; }
        .stock-list { padding: 4px 20px 10px; }
        .stock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 2px; border-bottom: 1px solid #edf1f3; }
        .stock-row:last-child { border-bottom: 0; }
        .empty-state { padding: 34px 20px; color: var(--muted); text-align: center; font-size: 13px; }
        .filter-card { display: grid; grid-template-columns: minmax(190px, 1.5fr) repeat(2, minmax(145px, .75fr)) auto; align-items: end; gap: 12px; padding: 18px; margin-bottom: 18px; }
        .field label { display: block; margin: 0 0 6px; color: #657681; font-size: 11px; font-weight: 750; }
        .field input, .field select {
            width: 100%;
            height: 41px;
            padding: 0 11px;
            border: 1px solid #dfe7ea;
            border-radius: 9px;
            outline: 0;
            background: white;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
        }
        .field input:focus, .field select:focus { border-color: #42aaa2; box-shadow: 0 0 0 3px rgba(8,126,120,.1); }
        .catalog-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 2px 12px; color: var(--muted); font-size: 12px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
        footer { padding: 19px 24px; border-top: 1px solid #e8eef0; color: #7d8c95; font-size: 11px; text-align: center; }
        @media (max-width: 820px) {
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .content-grid { grid-template-columns: 1fr; }
            .filter-card { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 540px) {
            .nav-wrap { min-height: 68px; padding: 0 18px; }
            .brand-caption { display: none; }
            .nav-links { gap: 0; }
            .nav-links a { padding: 8px 10px; font-size: 12px; }
            main { padding: 30px 16px 40px; }
            .page-heading { align-items: flex-start; flex-direction: column; gap: 15px; }
            .stats-grid { gap: 10px; }
            .stat-card { padding: 15px; }
            .stat-value { font-size: 23px; }
            .filter-card { grid-template-columns: 1fr; }
            .filter-card .button { width: 100%; }
            .section-header { padding: 17px; }
            th, td { padding-right: 13px; padding-left: 13px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="nav-wrap">
            <a class="brand" href="{% url 'catalogo:home' %}">
                <span class="brand-mark">D</span>
                <span><span class="brand-name">DEIVIDSAM STORE</span><span class="brand-caption">Panel de inventario</span></span>
            </a>
            <nav class="nav-links" aria-label="Navegación principal">
                <a class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'catalogo:home' %}">Inicio</a>
                <a class="{% if request.resolver_match.url_name == 'catalogo' %}active{% endif %}" href="{% url 'catalogo:catalogo' %}">Catálogo</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        {% block footer %}IS093A - Desarrollo de Aplicaciones Web | UNCP{% endblock %}
    </footer>
</body>
</html>
